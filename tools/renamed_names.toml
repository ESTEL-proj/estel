# The table of renamed names of phase P7 (Part I, §2.4.1; tools/check_retired_names.py; T7.2).
#
# One row per name that broke the rule of names, or that the hierarchy of Part I, §2.3.1 and the
# decisions of the maintainer renamed, with the task of phase P7 that renamed it.
#
#   old   the name, qualified: a module (`estel.data._planar`), a definition
#         (`estel.scattering._plan:PlanarPlan`, a method `module:Class.method`), a file that is
#         not a module (`tests/parity/fixtures/gradient_tp.npz`), a word or a label in a file
#         (`docs/maths.md#planar`, prose included), or a maths ID (`M-W1-TP`);
#   new   the new name: in the same module unless qualified; for a split, the new modules;
#   kind  rename, split, move (to another module), reintroduce (the old name back with a new
#         meaning, once its rename row is done: rule 6);
#   task  the task that renames it: of phase P7 (T7.3 to T7.11), or a later task (`Tn.m`) or
#         card of the register (`LFn`);
#   done  true once its task is merged: the task sets it in its own pull request;
#   note  optional: where the name comes from, or why.
#
# The tool is strict since T7.12 (`make check` runs it with --strict): it fails on a violation
# with no row, on a row not done, and when the old name of a row done occurs again outside
# history. The table stays after phase P7 so that no old name comes back (rule 6). Rows are no
# longer added for P7: a later rename of a name that breaks the rule adds its row, done, in its
# own pull request. A task that renames a name the tool does not detect adds its row too (done =
# true), so that the proof (tools/prove_unchanged.py) maps it.
#
# The IDs of docs/maths_step2.md are proposals of step 2: their form (rule 9) is checked when
# they enter docs/maths.md (T7.12, decision 2 on #203), so M-LP2 and M-ISO2 have no row.


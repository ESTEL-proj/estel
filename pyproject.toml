[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "estel"
version = "0.0.0"
description = "ESTEL — Estel is a Scattering Transform Exquisite Library. The successor of STL."
readme = "AGENTS.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Erwan Allys" }, { name = "Jean-Marc Delouis" }, { name = "Pablo Richard" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Minimum versions: Part I, §1.6. Upper bounds only for dependencies that often break their API.
dependencies = [
    "numpy>=2.0",
    "torch>=2.6,<3",
    "array-api-compat>=1.11",
]

[project.optional-dependencies]
# The experimental JAX backend (Part I, §1.6 and §2.2.5): opt-in, not covered by the 1.0.0
# guarantees.
jax = ["jax>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    # Parallel tests in `make check` and CI (task T0.7).
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "towncrier>=24.8",
    # Tier 0 runs the whole suite on the experimental JAX backend too (Part I, §3.1).
    "jax>=0.5",
    # Test-only (Part I, §1.5): the HEALPix geometry of T5.1 and the oracle of T5.4 are
    # compared with healpy in the tests, never imported by ESTEL. Pinned: the latest release
    # with wheels for Linux x86-64 and macOS arm64 (T5.3, issue #164).
    "healpy==1.20.1",
]
# The user documentation, docs/user/ (make docs; Read the Docs, .readthedocs.yaml).
docs = [
    "sphinx>=9.0",
    "pydata-sphinx-theme>=0.24",
    "myst-nb>=1.4",
    "numpydoc>=1.11",
    "sphinx-design>=0.8",
    "sphinx-copybutton>=0.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/estel"]

# CI and local installs take the CPU-only PyTorch wheels on Linux, which keeps tier 0 small.
# This affects uv-managed environments only, not the published package metadata.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- lint and types

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools", "tests"]
# Python only: never reformat code blocks in the documentation.
include = ["*.py", "*.pyi"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tools"]
files = ["src", "tools", "tests", "bench"]
explicit_package_bases = true

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# No test uses hypothesis yet: its plugin would cost 0.6 s in every pytest process (Part I, §5.4).
# Remove "-p no:hypothesispytest" with the first @given.
addopts = ["--strict-markers", "--strict-config", "-ra", "-p", "no:hypothesispytest"]
markers = [
    "maths(*ids): the docs/maths.md IDs (M-...) this test checks; read by tools/check_maths_ids.py",
    "serial: runs alone, in a pass without xdist workers, in the full tier only (`make check-full`): the test starts fresh processes or switches a process-wide setting",
    "slow: full tier only (`make check-full`; CI on main, nightly, label full-ci): the test cannot run in under 1 s; its docstring says why, in a sentence starting with 'Slow:' (Part I, section 5.4)",
    "dtype: also runs in float32 in the fast tier (`make check`): dtype propagation, representative parity cases, precision tests",
    "jax_smoke: runs on the experimental JAX backend in the fast tier: the L0 conformance suite and one parity case, of the scattering statistics",
    "xdist_group(name): tests that share one pytest-xdist worker (--dist loadgroup); registered here too for the runs without xdist",
]

# ---------------------------------------------------------------- import rules (Part I, §2.4)
#
# Contracts name only modules that exist in every phase (the root package and its
# descendants, through wildcards), so they hold on the empty package of P0 and keep holding
# as the layers are filled in.

[tool.importlinter]
root_packages = ["estel"]
include_external_packages = true
contract_types = [
    "optional_forbidden: import_contracts.OptionalForbiddenContract",
    "allowlist: import_contracts.AllowlistContract",
]

[[tool.importlinter.contracts]]
id = "backend-purity"
name = "torch, jax and optax are imported only under estel.backend"
type = "forbidden"
source_modules = ["estel"]
forbidden_modules = ["torch", "jax", "jaxlib", "optax"]
ignore_imports = [
    "estel.backend -> torch",
    "estel.backend.** -> torch",
    "estel.backend -> jax",
    "estel.backend.** -> jax",
    "estel.backend -> jaxlib",
    "estel.backend.** -> jaxlib",
    "estel.backend -> optax",
    "estel.backend.** -> optax",
]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Move the backend call into a primitive of src/estel/backend/ and call it through the L0 protocol."

[[tool.importlinter.contracts]]
id = "rust-engine-purity"
name = "estel_rust is imported only under estel.engines"
type = "forbidden"
source_modules = ["estel"]
forbidden_modules = ["estel_rust"]
ignore_imports = [
    "estel.engines -> estel_rust",
    "estel.engines.** -> estel_rust",
]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = "Only the engine adapter in src/estel/engines/ may talk to the Rust wheel."

[[tool.importlinter.contracts]]
id = "engines-not-backend"
name = "The engine layer never imports a backend directly"
type = "optional_forbidden"
source_modules = ["estel.engines"]
forbidden_modules = ["estel.backend"]
allow_indirect_imports = true
broken_contract_guidance = "An engine runs L2; go through estel.functional or estel.scattering instead."

[[tool.importlinter.contracts]]
id = "l2-mother-class-only"
name = "L2 talks to the Data mother class, never to a subclass"
type = "optional_forbidden"
source_modules = [
    "estel.scattering",
    "estel.statistics",
    "estel.synthesis",
    "estel.functional",
]
forbidden_modules = [
    "estel.data._cartesian",
    "estel.data._healpix",
    "estel.data._tensor_prod",
]
allow_indirect_imports = true
broken_contract_guidance = "Use the Data interface of estel.data._base; add a geometry hook there if L2 needs something new."

[[tool.importlinter.contracts]]
id = "wavelet-operator-only"
name = "Outside L1, the banks and mask builders go through WaveletOperator only"
type = "optional_forbidden"
# Every package of estel but wavelets and data (Part I, §2.3, §2.4; T2.10). The calls to the
# hooks of filtering and downsampling are checked by tools/check_layers.py.
source_modules = [
    "estel.scattering",
    "estel.statistics",
    "estel.synthesis",
    "estel.functional",
    "estel.spectra",
    "estel.diagnostics",
    "estel.engines",
    "estel.io",
    "estel.backend",
]
forbidden_modules = [
    "estel.wavelets._banks",
    "estel.wavelets._healpix_bank",
    "estel.data._masks",
]
allow_indirect_imports = true
broken_contract_guidance = "Go through estel.wavelets._operator: WaveletOperator and its WaveletPlan give the levels, their shapes, the kernels, and the rules of borders and masks; add what L2 needs there."

[[tool.importlinter.contracts]]
id = "layers"
name = "Layer order: engines, then L2, then L1, then L0; nothing imports upwards"
type = "layers"
containers = ["estel"]
layers = [
    "(engines)",
    # One layer, L2, whose packages may import one another: the operator returns STStatistics and
    # calls estel.functional, which runs the loop of estel.scattering (T2.5); estel.spectra holds
    # the spectrum operator and its estimators, which the loop of STOperator calls too (T4.1).
    "(scattering) : (statistics) : (synthesis) : (functional) : (spectra)",
    # L1: the wavelet operator of estel.wavelets calls the geometry hooks of estel.data and
    # reads its mask builders (T2.10); estel.data imports nothing from estel.wavelets.
    "(wavelets)",
    "(data)",
    "(backend)",
]
# The public STOperator lives in L2 and takes engine=: it checks the name and the capabilities in
# the engine registry, which holds declarations only and imports nothing from L2 (T2.5).
ignore_imports = ["estel.scattering._operator -> estel.engines._registry"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "oracle-independence"
name = "estel._spec imports NumPy only, and nothing from estel"
type = "allowlist"
source_module = "estel._spec"
allowed_external = ["numpy"]

# ---------------------------------------------------------------- news fragments (towncrier)

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
name = "ESTEL"
package = "estel"
package_dir = "src"
title_format = "## {name} {version} ({project_date})"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "major"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "minor"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "patch"
name = "Fixes and maintenance"
showcontent = true

# Benchmark cases of step 1 (Part I, §6.3; Part II, §15.2, task T2.11; issue #89).
#
# Few cases, each clear, at a realistic size, run outside CI by `make bench` (bench/README.md).
# They judge the optimisations of step 1 (T2.12 to T2.15) before and after: changing a case makes
# the earlier results of bench/results/ incomparable, so cases are added, not edited.
#
# Every case has one batch element, no power spectrum and norm="none", and measures the forward
# pass, the forward pass with the gradient of a loss, and the peak resident memory. The planar
# cases are 2D and measured against STL; a case with `blocks` is a tensor product, with one J, L
# and pbc per block, measured on ESTEL only (task T3.2).

[settings]
dtype = "float32"   # the default of ESTEL; STL follows the dtype of its input
device = "cpu"
threads = 4         # intra-op threads of the backend, fixed in every environment
warmup = 1          # runs before the timed ones
repeats = 5         # timed runs; the result is their median

[cases.planar-periodic]
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = true
seed = 1            # the field
target_seed = 2     # the second field, whose statistics are the target of the loss

[cases.planar-masked]
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = false
seed = 3
target_seed = 4
# Missing pixels: square holes of these sides, placed without overlap by a seeded draw;
# 26,560 pixels of 262,144, 10.1 %.
mask_seed = 5
mask_holes = [112, 88, 64, 40, 24]

[cases.planar-cross]
shape = [256, 256]
channels = 2        # with the cross terms: every pair of channels, STL's and ESTEL's default
J = 6
L = 4
pbc = true
seed = 6
target_seed = 7

[cases.planar-open]
# Added with task T2.14 (issue #92): `planar-masked` without its missing pixels. Non-periodic
# without mask is a common use, and the only case whose windows are slices (maths_step2 M-WIN):
# `planar-periodic` and `planar-cross` have full windows, `planar-masked` has weights.
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = false
seed = 3
target_seed = 4

[cases.tensor-prod-2d1d-64]
# Added with task T3.5 (issue #128), replacing `tensor-prod-2d1d` (32 x 32 x 16, J = (3, 2)),
# whose results stay in bench/results/: 2D+1D, space and time, periodic, one channel,
# L = (4, 2), the size the maintainer chose on #23 and #128 once the slow path of `conv_axes`
# along a 1D block is gone (T3.5, P1), where the forward pass with the gradient takes over 1 s
# on CPU (Apple M3: 1.66 s on PyTorch with P1, 4 threads; 1.48 s on JAX). ESTEL only.
blocks = ["2D", "1D"]
shape = [64, 64, 32]
channels = 1
J = [4, 3]
L = [4, 2]
pbc = [true, true]
seed = 8
target_seed = 9

[cases.healpix-masked-64]
# Added with task T5.7 (issue #168, decision 2): a HEALPix full sky at nside 64 (depth 6), NESTED,
# J = 5 (the default of maths.md M-DEF-HPX), L = 4 gauges, one channel, with about 10 % of
# missing pixels in five discs, so that the masks, whose tables the operator builds, are
# measured. The field is a white noise averaged over neighbouring pixels (bench/README.md).
# ESTEL only: its check against STL is the parity tests of HEALPix (T5.6); STL's HEALPix times
# come with the benchmark of step 2 (LF62).
geometry = "healpix"
shape = [49152]     # 12 · 4^6 pixels
channels = 1
J = 5
L = 4
pbc = true          # required for HEALPix by the harness: a full sky (DataHealpix.pbc)
seed = 10
target_seed = 11
# Missing pixels: discs of these angular radii, in degrees, placed without overlap by a seeded
# draw.
mask_seed = 12
mask_discs = [21, 19, 16, 13, 10]

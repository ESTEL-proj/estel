# Benchmark cases of step 1 (Part I, §6.3; Part II, §15.2, task T2.11; issue #89).
#
# Few cases, each clear, at a realistic size, run outside CI by `make bench` (bench/README.md).
# They judge the optimisations of step 1 (T2.12 to T2.15) before and after: changing a case makes
# the earlier results of bench/results/ incomparable, so cases are added, not edited.
#
# Every case has one batch element, no power spectrum and norm="none", and measures the forward
# pass, the forward pass with the gradient of a loss, and the peak resident memory. The planar
# cases are 2D and measured against STL; a case with `blocks` is a tensor product, with one J, L
# and pbc per block, measured on ESTEL only (task T3.2).

[settings]
dtype = "float32"   # the default of ESTEL; STL follows the dtype of its input
device = "cpu"
threads = 4         # intra-op threads of the backend, fixed in every environment
warmup = 1          # runs before the timed ones
repeats = 5         # timed runs; the result is their median

[cases.planar-periodic]
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = true
seed = 1            # the field
target_seed = 2     # the second field, whose statistics are the target of the loss

[cases.planar-masked]
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = false
seed = 3
target_seed = 4
# Missing pixels: square holes of these sides, placed without overlap by a seeded draw;
# 26,560 pixels of 262,144, 10.1 %.
mask_seed = 5
mask_holes = [112, 88, 64, 40, 24]

[cases.planar-cross]
shape = [256, 256]
channels = 2        # with the cross terms: every pair of channels, STL's and ESTEL's default
J = 6
L = 4
pbc = true
seed = 6
target_seed = 7

[cases.planar-open]
# Added with task T2.14 (issue #92): `planar-masked` without its missing pixels. Non-periodic
# without mask is a common use, and the only case whose windows are slices (maths_step2 M-WIN):
# `planar-periodic` and `planar-cross` have full windows, `planar-masked` has weights.
shape = [512, 512]
channels = 1
J = 7
L = 4
pbc = false
seed = 3
target_seed = 4

[cases.tensor-prod-2d1d]
# Added with task T3.2 (issue #23): 2D+1D, space and time, periodic, one channel, L = (4, 2), the
# smallest size whose forward pass with the gradient takes at least 1 s on CPU with the code of
# T3.2 (1.15 s on PyTorch, Apple M3, 4 threads). ESTEL only. Most of that time is the slow path
# of `conv_axes` along a 1D block, the first trial of T3.5 (#128), which then replaces this case
# by 64 x 64 x 32, J = (4, 3) (decision of the maintainer on #23, 23 November 2026).
blocks = ["2D", "1D"]
shape = [32, 32, 16]
channels = 1
J = [3, 2]
L = [4, 2]
pbc = [true, true]
seed = 8
target_seed = 9

# Tier 0 (Part I, §6.1): GitHub-hosted CPU, every push and pull request, at most 15 minutes.
name: tier0

on:
  push:
  pull_request:

# Least privilege (review rule E5): the token can only read the repository. No job needs more:
# the version-impact step reads PR labels from the event payload, not from the API.
permissions:
  contents: read

concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true

# Two parallel jobs, one per backend (Part I, §3.1 and §6.1). The PyTorch job keeps the name
# "make check", which the main ruleset requires; the JAX job runs the whole test suite on the
# experimental JAX backend. The tests run in parallel, in pytest-xdist workers (Makefile).
#
# Scope (task T0.7): a pull request, or a push to another branch than the default one, whose
# files are all in the no-test scope of tools/ci_scope.py (docs/, .github/, changes/; .gitignore,
# LICENSE, NOTICE and README.md at the root; every AGENTS.md and CLAUDE.md, at any depth) skips
# the test suites, unless a test reads one of them (docs/maths.md, for example). The PyTorch job
# then runs only the check tools and the JAX job only reports the skip; both jobs still run and
# succeed, so the required checks report a result and the PR can merge. Do not move the scope
# to a job of its own that the others `need`: if it failed, they would be skipped, and a skipped
# required check counts as passed. A push to the default branch always runs everything.
jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # version_impact.py and ci_scope.py diff against the base branch
          persist-credentials: false

      - name: Scope of the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci_scope.py --base "origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            python3 tools/ci_scope.py --base "origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_scope.py >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: make check
        if: steps.scope.outputs.tests != 'false'
        run: make check TEST_BACKENDS=torch

      - name: make check-tools (no-test scope only)
        if: steps.scope.outputs.tests == 'false'
        run: make check-tools

      - name: Version impact (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >
          uv run --locked python tools/version_impact.py
          --base "origin/$BASE_REF" --pr "$PR_NUMBER" --labels "$PR_LABELS"

  check-jax:
    name: make check (jax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # ci_scope.py diffs against the base branch
          persist-credentials: false

      - name: Scope of the change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/ci_scope.py --base "origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            python3 tools/ci_scope.py --base "origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_scope.py >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.tests != 'false'
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install the locked environment
        if: steps.scope.outputs.tests != 'false'
        run: uv sync --locked

      - name: Tests on JAX, float32 and float64
        if: steps.scope.outputs.tests != 'false'
        run: make test TEST_BACKENDS=jax

      - name: No tests (no-test scope only)
        if: steps.scope.outputs.tests == 'false'
        run: echo "Every changed file is in the no-test scope (tools/ci_scope.py); the check tools run in the make check job."
